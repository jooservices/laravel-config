name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run Composer audit
        run: composer audit --no-dev

  lint:
    name: Lint - ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    needs: [security]
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: Pint
            command: lint:pint
          - name: PHPCS
            command: lint:phpcs
          - name: PHPStan
            command: lint:phpstan
          - name: PHPMD
            command: lint:phpmd
          - name: PHP-CS-Fixer
            command: lint:cs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run ${{ matrix.tool.name }}
        run: composer ${{ matrix.tool.command }}

  tests-matrix:
    name: Tests & Coverage (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # Laravel 11 stays in composer.json's support range but is excluded from this
        # matrix: every orchestra/testbench release compatible with Laravel 11 currently
        # resolves to a laravel/framework patch flagged by Composer's audit policy.
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
            coverage: true
          - laravel: '13'
            testbench: '^11.0'
            coverage: false
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: jooservices_configs_ci
      XDEBUG_MODE: coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Require Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/cache:^${{ matrix.laravel }}.0" \
            "illuminate/config:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0"
          composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction

      - name: Run tests with coverage
        if: matrix.coverage
        run: composer test:coverage

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test -- --no-coverage

      - name: Upload coverage artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/clover.xml

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.coverage && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: build/coverage/clover.xml

  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: [tests-matrix]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "::error::Tests & Coverage matrix did not succeed"
            exit 1
          fi
